{% extends "base.html" %}

{% block title %}Shopping Cart - E-Commerce Store{% endblock %}

{% block content %}
<h1>Shopping Cart</h1>

<div class="row">
    <div class="col-md-8">
        <div id="cart-items">
            <!-- Cart items will be loaded here -->
        </div>
        <div id="empty-cart" class="text-center py-5" style="display: none;">
            <i class="fas fa-shopping-cart fa-3x text-muted mb-3"></i>
            <h3>Your cart is empty</h3>
            <p>Add some products to get started!</p>
            <a href="{{ url_for('views.products') }}" class="btn btn-primary">Continue Shopping</a>
        </div>
    </div>
    
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h5>Order Summary</h5>
            </div>
            <div class="card-body">
                <div class="d-flex justify-content-between mb-2">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span>Shipping:</span>
                    <span id="shipping">$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span>Tax:</span>
                    <span id="tax">$0.00</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-3">
                    <strong>Total:</strong>
                    <strong id="total">$0.00</strong>
                </div>
                <button class="btn btn-success w-100" id="checkout-btn">
                    Proceed to Checkout
                </button>
                <button class="btn btn-outline-danger w-100 mt-2" id="clear-cart">
                    Clear Cart
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
