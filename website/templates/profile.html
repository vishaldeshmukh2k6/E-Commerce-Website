{% extends "base.html" %}

{% block title %}Profile - E-Commerce Store{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-3">
        <div class="list-group">
            <a href="#profile" class="list-group-item list-group-item-action active" data-bs-toggle="tab">
                <i class="fas fa-user"></i> Profile
            </a>
            <a href="#orders" class="list-group-item list-group-item-action" data-bs-toggle="tab">
                <i class="fas fa-shopping-bag"></i> Orders
            </a>
            <a href="#addresses" class="list-group-item list-group-item-action" data-bs-toggle="tab">
                <i class="fas fa-map-marker-alt"></i> Addresses
            </a>
            <a href="#wishlist" class="list-group-item list-group-item-action" data-bs-toggle="tab">
                <i class="fas fa-heart"></i> Wishlist
            </a>
        </div>
    </div>
    
    <div class="col-md-9">
        <div class="tab-content">
            <div class="tab-pane fade show active" id="profile">
                <div class="card">
                    <div class="card-header">
                        <h5>Profile Information</h5>
                    </div>
                    <div class="card-body">
                        <form id="profile-form">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="firstName" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstName">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="lastName" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email">
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="phone">
                            </div>
                            <button type="submit" class="btn btn-primary">Update Profile</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="tab-pane fade" id="orders">
                <div class="card">
                    <div class="card-header">
                        <h5>Order History</h5>
                    </div>
                    <div class="card-body">
                        <div id="orders-list">
                            <!-- Orders will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="tab-pane fade" id="addresses">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5>Saved Addresses</h5>
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addressModal">
                            Add Address
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="addresses-list">
                            <!-- Addresses will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="tab-pane fade" id="wishlist">
                <div class="card">
                    <div class="card-header">
                        <h5>My Wishlist</h5>
                    </div>
                    <div class="card-body">
                        <div id="wishlist-items">
                            <!-- Wishlist items will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Address Modal -->
<div class="modal fade" id="addressModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Address</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="address-form">
                    <div class="mb-3">
                        <label for="addressType" class="form-label">Address Type</label>
                        <select class="form-select" id="addressType">
                            <option value="home">Home</option>
                            <option value="work">Work</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="street" class="form-label">Street Address</label>
                        <input type="text" class="form-control" id="street" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="state" class="form-label">State</label>
                            <input type="text" class="form-control" id="state" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="zipCode" class="form-label">Zip Code</label>
                        <input type="text" class="form-control" id="zipCode" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="address-form" class="btn btn-primary">Save Address</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
