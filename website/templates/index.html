{% extends "base.html" %}

{% block title %}Home - E-Commerce Store{% endblock %}

{% block content %}

    <!-- SLIDER WRAPPER -->
<div class="relative w-full max-w-6xl mx-auto mt-6 overflow-hidden rounded-lg shadow-lg">

    <!-- Slider Container -->
    <div id="slider" class="flex transition-transform duration-700 ease-out">

        <img src="{{ url_for('static', filename='img/scroll-img.jpeg') }}"
             class="w-full flex-shrink-0" />

        <img src="{{ url_for('static', filename='img/scroll-img2.jpg') }}"
             class="w-full flex-shrink-0" />

        <img src="{{ url_for('static', filename='img/img2.jpg') }}"
             class="w-full flex-shrink-0" />

        <img src="{{ url_for('static', filename='img/imag3.jpg') }}"
             class="w-full flex-shrink-0" />

    </div>

    <!-- LEFT ARROW -->
    <button id="prevBtn"
            class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/70 hover:bg-white shadow-md p-3 rounded-full">
        <i class="fas fa-chevron-left text-xl"></i>
    </button>

    <!-- RIGHT ARROW -->
    <button id="nextBtn"
            class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/70 hover:bg-white shadow-md p-3 rounded-full">
        <i class="fas fa-chevron-right text-xl"></i>
    </button>

</div>

<!-- JavaScript Slider Logic -->
<script>
    const slider = document.getElementById("slider");
    const nextBtn = document.getElementById("nextBtn");
    const prevBtn = document.getElementById("prevBtn");

    let index = 0;

    function updateSlider() {
        slider.style.transform = `translateX(-${index * 100}%)`;
    }

    nextBtn.addEventListener("click", () => {
        index = (index + 1) % slider.children.length;
        updateSlider();
    });

    prevBtn.addEventListener("click", () => {
        index = (index - 1 + slider.children.length) % slider.children.length;
        updateSlider();
    });

    // Auto-slide every 3 seconds
    setInterval(() => {
        index = (index + 1) % slider.children.length;
        updateSlider();
    }, 3000);
</script>


{% endblock %}
