{% extends "base.html" %}

{% block title %}Manage Orders - Admin{% endblock %}

{% block content %}
<h1>Manage Orders</h1>

<div class="row mb-4">
    <div class="col-md-4">
        <select class="form-select" id="statusFilter">
            <option value="">All Orders</option>
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
        </select>
    </div>
    <div class="col-md-4">
        <input type="date" class="form-control" id="dateFrom" placeholder="From Date">
    </div>
    <div class="col-md-4">
        <input type="date" class="form-control" id="dateTo" placeholder="To Date">
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Date</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="orders-table">
                    <!-- Orders will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Order Details Modal -->
<div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Order Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="order-details">
                    <!-- Order details will be loaded here -->
                </div>
            </div>
            <div class="modal-footer">
                <select class="form-select me-2" id="orderStatus" style="width: auto;">
                    <option value="pending">Pending</option>
                    <option value="processing">Processing</option>
                    <option value="shipped">Shipped</option>
                    <option value="delivered">Delivered</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                <button type="button" class="btn btn-primary" id="updateStatus">Update Status</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
