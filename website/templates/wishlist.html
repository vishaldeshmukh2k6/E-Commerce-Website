{% extends "base.html" %}

{% block title %}Wishlist - E-Commerce Store{% endblock %}

{% block content %}
<h1>My Wishlist</h1>

<div id="wishlist-items">
    <!-- Wishlist items will be loaded here -->
</div>

<div id="empty-wishlist" class="text-center py-5" style="display: none;">
    <i class="fas fa-heart fa-3x text-muted mb-3"></i>
    <h3>Your wishlist is empty</h3>
    <p>Save your favorite products here!</p>
    <a href="{{ url_for('views.products') }}" class="btn btn-primary">Browse Products</a>
</div>
{% endblock %}
